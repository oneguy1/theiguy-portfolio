<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LJS5W9Q4Z0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LJS5W9Q4Z0');
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Modeling | The iGuy</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <style>
        :root {
            --teal: #48C1CF;
            --dark-grey: #1a1a1a;
            --modal-bg: #232323;
            --light-text: #ffffff;
            --sub-text: #b0b0b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1c3d42 100%);
            background-attachment: fixed;
            color: var(--light-text);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        nav { margin-bottom: 40px; }
        .back-link {
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }

        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: var(--sub-text); margin-bottom: 50px; max-width: 700px; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 0;
            text-align: left;
            font: inherit;
            color: inherit;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--teal);
        }

        .card-thumb { width: 100%; height: 220px; object-fit: cover; background: #222; display: block; }
        .card-info { padding: 20px; }
        .card-info h2 { font-size: 1.3rem; margin-bottom: 5px; color: var(--teal); }
        .card-info p { font-size: 0.9rem; color: var(--sub-text); }

        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
        }

        .modal-overlay.is-open { display: block; }

        .modal-content {
            background-color: var(--modal-bg);
            margin: 2% auto;
            padding: 25px;
            border: 1px solid rgba(72, 193, 207, 0.5);
            border-radius: 20px;
            max-width: 950px;
            width: 95%;
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: var(--teal);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--teal);
            border-color: var(--teal);
            color: #000;
            font-weight: bold;
        }

        .hero-container {
            width: 100%;
            height: min(500px, 70vh);
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        model-viewer, .hero-image-display {
            width: 100%;
            height: 100%;
            display: none;
        }

        .hero-image-display { object-fit: contain; background: #111; }

        .active-view { display: block !important; }

        .modal-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .thumb-btn {
            padding: 0;
            border: 2px solid transparent;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }

        .thumb-btn img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .thumb-btn:hover, .thumb-btn.active {
            opacity: 1;
            border-color: var(--teal);
        }

        .modal-description { margin-top: 20px; color: var(--sub-text); }

        .modal-meta {
            margin-top: 8px;
            color: var(--sub-text);
            font-size: 0.95rem;
        }

        .model-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--teal);
            font-weight: 600;
            text-decoration: none;
        }

        .model-link:hover { text-decoration: underline; }

        .project-card:focus-visible,
        .toggle-btn:focus-visible,
        .thumb-btn:focus-visible,
        .close-btn:focus-visible,
        .back-link:focus-visible,
        .model-link:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 3px;
        }

        footer { text-align: center; margin-top: 80px; font-size: 0.8rem; color: #555; }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .hero-container { height: 280px; }
            .modal-content { margin: 12px auto; padding: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <nav><a href="index.html" class="back-link">← Back to Home</a></nav>

    <header>
        <h1>3D Modeling Showcase</h1>
        <p>Explore interactive CAD models and high-resolution renders of my design projects.</p>
    </header>

    <main class="projects-grid" id="projects-grid"></main>

    <footer>&copy; 2026 The iGuy</footer>
</div>

<div id="project-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title" class="modal-title"></h2>
            <button type="button" class="close-btn" id="modal-close" aria-label="Close">&times;</button>
        </div>

        <div class="view-toggle" role="group" aria-label="Choose a view">
            <button type="button" class="toggle-btn active" id="view-3d" aria-pressed="true">3D Model</button>
            <button type="button" class="toggle-btn" id="view-img" aria-pressed="false">Photos</button>
        </div>

        <div class="hero-container">
            <model-viewer id="model-viewer" camera-controls auto-rotate shadow-intensity="1" alt=""></model-viewer>
            <img id="hero-image" class="hero-image-display" alt="">
        </div>

        <div class="modal-gallery-grid" id="modal-gallery"></div>
        <p id="modal-description" class="modal-description"></p>
        <p id="modal-meta" class="modal-meta" hidden></p>
        <a id="model-link" class="model-link" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
</div>

<script>
    const projects = [
        {
            title: "Hex Tool Organizer",
            blurb: "Compact honeycomb design for drill bits.",
            description: "A compact honeycomb organizer made to hold drill bits.",
            model: "3dmodels/hex_tool.glb",
            cover: "3dmodels/hex_tool1.png",
            images: [
                { src: "3dmodels/hex_tool1.png", alt: "Hex Tool Organizer, photo 1" },
                { src: "3dmodels/hex_tool2.jpg", alt: "Hex Tool Organizer, photo 2" },
                { src: "3dmodels/hex_tool3.jpg", alt: "Hex Tool Organizer, photo 3" }
            ]
        },
        {
            title: "MK1 MR2 Keychain",
            blurb: "A simple AW11 silhouette keychain.",
            description: "A simple keychain in the silhouette of an AW11, the first-generation Toyota MR2.",
            model: "3dmodels/mk1mr2.glb",
            cover: "3dmodels/mr2_1.jpg",
            images: [
                { src: "3dmodels/mr2_1.jpg", alt: "MK1 MR2 Keychain, photo 1" },
                { src: "3dmodels/mr2_2.jpg", alt: "MK1 MR2 Keychain, photo 2" },
                { src: "3dmodels/mr2_3.jpg", alt: "MK1 MR2 Keychain, photo 3" }
            ]
        },
        {
            title: "Laptop Stand",
            blurb: "Vertical space-saving desktop solution.",
            description: "A vertical stand that holds a laptop upright and frees desk space.",
            model: "3dmodels/laptop_stand.glb",
            cover: "3dmodels/laptop_stand1.jpg",
            images: [
                { src: "3dmodels/laptop_stand1.jpg", alt: "Laptop Stand, photo 1" },
                { src: "3dmodels/laptop_stand2.jpg", alt: "Laptop Stand, photo 2" },
                { src: "3dmodels/laptop_stand3.jpg", alt: "Laptop Stand, photo 3" },
                { src: "3dmodels/laptop_stand4.jpg", alt: "Laptop Stand, photo 4" },
                { src: "3dmodels/laptop_stand5.jpg", alt: "Laptop Stand, photo 5" }
            ]
        },
        {
            title: "Razor Shield",
            blurb: "Travel protection for Edge razors.",
            description: "A cover that protects Edge razors while traveling.",
            model: "3dmodels/razor_shield.glb",
            cover: "3dmodels/razor_1.jpg",
            images: [
                { src: "3dmodels/razor_1.jpg", alt: "Razor Shield, photo 1" },
                { src: "3dmodels/razor_2.jpg", alt: "Razor Shield, photo 2" },
                { src: "3dmodels/razor_3.jpg", alt: "Razor Shield, photo 3" },
                { src: "3dmodels/razor_4.jpg", alt: "Razor Shield, photo 4" }
            ]
        },
        {
            title: "Foosball Bead",
            blurb: "Custom replacement score counter.",
            description: "A custom replacement bead for a foosball score counter.",
            model: "3dmodels/foosball_bead.glb",
            cover: "3dmodels/foosball_1.jpg",
            images: [
                { src: "3dmodels/foosball_1.jpg", alt: "Foosball Bead, photo 1" },
                { src: "3dmodels/foosball_2.jpg", alt: "Foosball Bead, photo 2" },
                { src: "3dmodels/foosball_3.jpg", alt: "Foosball Bead, photo 3" },
                { src: "3dmodels/foosball_4.jpg", alt: "Foosball Bead, photo 4" }
            ]
        }
    ];

    const grid = document.getElementById("projects-grid");
    const modal = document.getElementById("project-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalDescription = document.getElementById("modal-description");
    const modalMeta = document.getElementById("modal-meta");
    const modelLink = document.getElementById("model-link");
    const viewer = document.getElementById("model-viewer");
    const heroImg = document.getElementById("hero-image");
    const gallery = document.getElementById("modal-gallery");
    const closeBtn = document.getElementById("modal-close");
    const view3dBtn = document.getElementById("view-3d");
    const viewImgBtn = document.getElementById("view-img");
    let lastTrigger = null;

    projects.forEach((project, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "project-card";
        card.setAttribute("aria-haspopup", "dialog");

        const cover = document.createElement("img");
        cover.className = "card-thumb";
        cover.src = project.cover;
        cover.alt = "";
        cover.loading = "lazy";

        const info = document.createElement("div");
        info.className = "card-info";
        const heading = document.createElement("h2");
        heading.textContent = project.title;
        const blurb = document.createElement("p");
        blurb.textContent = project.blurb;
        info.append(heading, blurb);
        card.append(cover, info);

        card.addEventListener("click", () => openModal(index, card));
        grid.appendChild(card);
    });

    function openModal(index, trigger) {
        const project = projects[index];
        lastTrigger = trigger;

        modalTitle.textContent = project.title;
        modalDescription.textContent = project.description;
        viewer.alt = project.title + " 3D model";
        viewer.poster = project.images[0].src;
        viewer.src = project.model;

        heroImg.src = project.images[0].src;
        heroImg.alt = project.images[0].alt;

        gallery.replaceChildren();
        project.images.forEach((image) => {
            const thumb = document.createElement("button");
            thumb.type = "button";
            thumb.className = "thumb-btn";
            thumb.dataset.src = image.src;
            thumb.setAttribute("aria-label", image.alt);

            const img = document.createElement("img");
            img.src = image.src;
            img.alt = "";
            thumb.appendChild(img);

            thumb.addEventListener("click", () => {
                heroImg.src = image.src;
                heroImg.alt = image.alt;
                switchView("img");
            });
            gallery.appendChild(thumb);
        });

        if (project.material) {
            modalMeta.hidden = false;
            modalMeta.textContent = project.material;
        } else {
            modalMeta.hidden = true;
            modalMeta.textContent = "";
        }

        if (project.link) {
            modelLink.hidden = false;
            modelLink.href = project.link;
            modelLink.textContent = project.linkLabel || "View model";
        } else {
            modelLink.hidden = true;
            modelLink.removeAttribute("href");
            modelLink.textContent = "";
        }

        switchView("3d");
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        closeBtn.focus();
    }

    function closeModal() {
        if (!modal.classList.contains("is-open")) return;
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "auto";
        viewer.src = "";
        if (lastTrigger) lastTrigger.focus();
    }

    function switchView(type) {
        const show3d = type === "3d";
        viewer.classList.toggle("active-view", show3d);
        heroImg.classList.toggle("active-view", !show3d);
        view3dBtn.classList.toggle("active", show3d);
        viewImgBtn.classList.toggle("active", !show3d);
        view3dBtn.setAttribute("aria-pressed", String(show3d));
        viewImgBtn.setAttribute("aria-pressed", String(!show3d));
        if (!show3d) markActiveThumb();
    }

    function markActiveThumb() {
        const thumbs = [...gallery.querySelectorAll(".thumb-btn")];
        const current = heroImg.src;
        let match = thumbs.find((thumb) => thumb.querySelector("img").src === current);
        if (!match) match = thumbs[0];
        thumbs.forEach((thumb) => {
            const selected = thumb === match;
            thumb.classList.toggle("active", selected);
            if (selected) thumb.setAttribute("aria-current", "true");
            else thumb.removeAttribute("aria-current");
        });
    }

    closeBtn.addEventListener("click", closeModal);
    view3dBtn.addEventListener("click", () => switchView("3d"));
    viewImgBtn.addEventListener("click", () => switchView("img"));

    modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModal();
    });
</script>

</body>
</html>
